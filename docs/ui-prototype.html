<!-- 검색·근거 대조 화면 3안을 비교하는 폐기 가능한 UI 시안이며 실제 자료를 사용하지 않는다. -->
<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>성문헌 연구실 · 화면 검토 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#24312f;font:15px/1.65 'Malgun Gothic',system-ui,sans-serif;padding-bottom:112px}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer;border:1px solid #c7cfca;border-radius:8px;padding:8px 13px;background:#fff;color:inherit}button:hover{background:#eaf1ed}button[aria-current],button[aria-pressed=true]{background:#164c3b;color:white;border-color:#164c3b}button:disabled{cursor:not-allowed;opacity:.6}a{color:#215c47}h1,h2,h3,p{margin:0}h1{font-size:26px;letter-spacing:-1px}h2{font-size:19px;margin-bottom:10px}h3{font-size:16px}small,.muted{color:#52645d;font-size:13px}.prototype-note{background:#263b33;color:#fff;padding:9px 24px;font-size:13px}.topbar{background:#fff;border-bottom:1px solid #dce2dc;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 28px}.brand{font-size:20px;font-weight:800;letter-spacing:-.6px}.brand span{font-weight:400;font-size:12px;margin-left:12px}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button{border-color:transparent}.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:5px;background:#e8efea;color:#315745;margin:0 5px 5px 0}.warning{background:#fff2d5;color:#71521b}.neutral{background:#edf0f2;color:#485c64}.notice{border:1px solid #e2c88c;background:#fff9ea;border-radius:8px;padding:12px 16px;font-size:13px;margin:14px 0}.status{font-size:13px;margin:8px 0 18px;color:#395747}.search-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}.search-form label{display:grid;gap:5px;font-size:12px;font-weight:600}.search-form .query{flex:1;min-width:220px}.search-form input,.search-form select{border:1px solid #b9c6bd;background:#fff;border-radius:7px;padding:10px;min-width:0;width:100%;color:#24312f}.primary{background:#164c3b;color:#fff;border-color:#164c3b}.primary:hover{background:#22654f}.filters{margin-top:12px;display:flex;gap:12px;flex-wrap:wrap}.filters summary{cursor:pointer;font-size:13px}.filters label{display:inline-grid;font-size:12px;gap:4px;margin:8px 10px 0 0}.filters input,.filters select{padding:6px;border:1px solid #bac7be;border-radius:4px;background:white}.panel{background:#fff;border:1px solid #d9e0d9;border-radius:10px;padding:22px}.result{width:100%;text-align:left;padding:17px;margin:0 0 10px;background:white}.result.active{border:2px solid #307656;background:#f2f8f2;padding:16px}.result h3{margin:6px 0}.result p{font-size:13px;color:#53635d}.result .number{font-weight:700;color:#32664e;margin-right:8px}.results-meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.reader-head{border-bottom:1px solid #e0e6e0;padding-bottom:16px;margin-bottom:20px}.reader-head h2{margin:7px 0}.parallel{display:grid;grid-template-columns:1fr 1fr;gap:24px}.parallel section+section{border-left:1px solid #dce3dc;padding-left:24px}.parallel p{font-size:16px;line-height:1.95;margin:12px 0}.parallel [lang=en]{font-family:Georgia,serif;font-size:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.evidence{margin-top:20px;padding-top:14px;border-top:1px solid #e0e6e0;font-size:12px;color:#55685d;overflow-wrap:anywhere}.scenario{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.scenario label{font-size:12px}.scenario select{padding:5px;border:1px solid #bcc8bf;background:white;border-radius:5px}.page-title{margin-bottom:20px}.rows{display:grid;gap:12px}.row{border-bottom:1px solid #e0e5df;padding:14px 0;display:flex;justify-content:space-between;gap:20px;align-items:center}.row .actions{margin-top:8px}.shell-a{display:grid;grid-template-columns:178px minmax(0,1fr);min-height:calc(100vh - 200px)}.shell-a aside{padding:25px 16px;background:#ecefe8;border-right:1px solid #d5ddd4}.shell-a .nav{display:grid}.shell-a aside small{display:block;margin:24px 8px}.work-a{padding:24px;min-width:0}.split-a{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px}.split-a .panel{padding:19px}.portal{max-width:1120px;margin:auto;padding:38px 28px}.portal .hero{text-align:center;margin:5px 0 28px}.hero p{margin-top:8px}.portal .search-form{max-width:900px;margin:auto}.portal .search-form input{padding:16px}.portal .reader{margin-top:22px}.portal .result{border-radius:0;border-width:0 0 1px;padding:20px 4px}.portal .result.active{background:transparent;border-bottom:2px solid #307656}.reading-bar{padding:15px 28px;background:#fafbf8;border-bottom:1px solid #d7dfd7}.reading-shell{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:32px;padding:30px;max-width:1460px;margin:auto}.reading-shell .reader{padding:30px 38px}.reading-shell .reader h2{font-family:Georgia,'Malgun Gothic',serif;font-size:25px}.reading-shell .reader .parallel{gap:30px}.reading-shell .reader .parallel p{font-size:17px;line-height:2.1}.reading-shell .results{order:2}.simple{max-width:1120px;margin:30px auto;padding:25px}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;background:#20352c;color:#fff;padding:9px 12px;border-radius:13px;box-shadow:0 5px 24px #0003;display:flex;gap:12px;align-items:center;max-width:calc(100% - 24px)}.switcher button{background:#334c40;color:#fff;border:1px solid #708276;padding:8px 14px}.switcher strong{font-size:14px}.switcher small{color:#d6e2d5;display:block;font-size:11px;white-space:nowrap}.state{margin:0;padding:12px 26px;background:#e6ede4;color:#3b5846;font-size:12px;overflow-wrap:anywhere}.skip{position:absolute;top:-60px;left:12px;background:white;padding:10px;z-index:20}.skip:focus{top:10px}
.result[aria-pressed=true]{color:#24312f}
@media(max-width:1100px){.shell-a{grid-template-columns:145px minmax(0,1fr)}.split-a{grid-template-columns:250px minmax(0,1fr)}.parallel{grid-template-columns:1fr}.parallel section+section{border-left:0;border-top:1px solid #dce3dc;padding:18px 0 0}.reading-shell{grid-template-columns:minmax(0,1fr) 250px;gap:16px;padding:20px}.reading-shell .reader{padding:24px}}
@media(max-width:760px){.topbar{padding:16px;align-items:flex-start;flex-direction:column;gap:12px}.brand span{display:block;margin:0}.shell-a{display:block}.shell-a aside{padding:12px;border-right:0}.shell-a .nav{display:flex}.shell-a aside small{display:none}.work-a,.portal{padding:18px}.split-a{grid-template-columns:1fr}.reading-shell{display:flex;flex-direction:column;padding:16px}.reading-shell .results{order:0}.reading-shell .reader{padding:20px}.reading-bar{padding:16px}.row{flex-direction:column;align-items:flex-start;gap:5px}.scenario{gap:6px}.switcher{width:calc(100% - 24px);justify-content:space-between}.prototype-note{padding:8px 16px}.simple{margin:16px;padding:18px}.search-form .query{min-width:100%}.state{padding:10px 16px}}
</style>
<a href="#main" class="skip">본문으로 이동</a>
<div class="prototype-note">화면 검토용 시안 · 모든 본문·건수·기록은 합성 예시입니다. 실제 DB·검색·번역·파일 작업을 수행하지 않습니다.</div>
<div id="app"></div>
<div class="switcher" aria-label="화면 배치 비교">
  <button id="previous" aria-label="이전 화면안">←</button>
  <div><strong id="variant-label"></strong><small>시안 전용 · 좌우 방향키로 비교</small></div>
  <button id="next" aria-label="다음 화면안">→</button>
</div>
<script>
// 화면 배치와 합성 예시 상태를 메모리에서만 바꾸며 외부 요청이나 저장을 하지 않는다.
const variants = {A:'연구실형 · 결과와 근거를 한눈에',B:'검색 포털형 · 질문부터 시작',C:'문헌 읽기형 · 원문 대조에 집중'};
const params = new URLSearchParams(location.search);
let variant = Object.hasOwn(variants, params.get('variant')) ? params.get('variant') : 'A';
let screen = 'search', query = '성경과 성전의 관계', source = 'all', mode = 'hybrid', scenario = 'normal', selected = 0;
let message = '예시 검색 실행 01 · 보관 자료 세대 03 · 전체 수집 완료를 뜻하지 않습니다.';
const samples = [
  {source:'vatican',label:'교황청 자료 예시',title:'공의회 문헌 · 원문 대조 예시',language:'영어',date:'발표일 미확인',locator:'추출 블록 20 · 공식 문단 번호 아님'},
  {source:'naju',label:'나주 자료 예시',title:'사랑의 메시지 · 한국어 문단 예시',language:'한국어',date:'발표일 미확인',locator:'추출 블록 5 · 공식 문단 번호 아님'},
  {source:'user_import',label:'가져온 파일 예시',title:'개인 연구 자료 · 스캔 PDF 예시',language:'한국어 OCR',date:'발행 출처 미확인',locator:'PDF 3쪽 · OCR 미검토'}
];
const escape = text => text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){return `<nav class="nav" aria-label="주 메뉴">${[['search','검색'],['library','자료실'],['history','검색 기록']].map(([key,label])=>`<button data-screen="${key}" ${screen===key?'aria-current="page"':''}>${label}</button>`).join('')}</nav>`;}
function header(sidebar=false){return `<header class="topbar"><div class="brand">성문헌 연구실<span>HOLY NAJU SEARCH · 개인 연구 공간</span></div>${sidebar?'<small>로컬 우선 · 외부 모델 전송 없음</small>':nav()}</header>`;}
function searchForm(){return `<form class="search-form" id="search-form"><label class="query">연구할 단어나 질문<input name="query" value="${escape(query)}" maxlength="500" required></label><label>출처<select name="source">${[['all','전체 출처'],['vatican','교황청'],['naju','나주'],['user_import','가져온 파일']].map(([key,label])=>`<option value="${key}" ${source===key?'selected':''}>${label}</option>`).join('')}</select></label><label>찾는 방식<select name="mode">${[['hybrid','키워드 + 의미'],['keyword','키워드'],['phrase','정확한 구절']].map(([key,label])=>`<option value="${key}" ${mode===key?'selected':''}>${label}</option>`).join('')}</select></label><button class="primary" type="submit">검색 예시 보기</button></form><details class="filters"><summary>언어·문헌 종류·발표일 조건 배치 예시</summary><p class="muted">아래 조건은 배치 검토용으로 비활성화되어 있습니다.</p><label>언어<select disabled><option>전체 언어</option></select></label><label>문헌 종류<select disabled><option>교리서·공의회·회칙</option></select></label><label>발표일부터<input type="date" disabled></label><label>발표일까지<input type="date" disabled></label></details>`;}
function scenarioBar(){return `<div class="scenario"><label for="scenario">상태 예시</label><select id="scenario">${[['normal','일반 결과'],['reused','저장 결과 재사용'],['fallback','모델 꺼짐 · 키워드 대체'],['translation-failed','번역 실패'],['empty','결과 없음'],['search-failed','검색 실패']].map(([key,label])=>`<option value="${key}" ${scenario===key?'selected':''}>${label}</option>`).join('')}</select></div>`;}
function status(){let text={normal:message,reused:'예시 · 저장 결과를 재사용했습니다. 최초 검색 10:00 / 이번 열기 10:05. 당시 원문 버전을 유지합니다.',fallback:'예시 · 의미 모델을 사용할 수 없어 키워드 검색으로 대체했습니다. 외국어 검색 결과가 줄어들 수 있습니다.','translation-failed':'예시 · 번역에 실패했습니다. 원문은 계속 읽을 수 있고 실패 결과는 정상 번역으로 재사용하지 않습니다.',empty:'예시 · 이 조건에서 찾은 결과가 없습니다. 검색 자체는 정상 완료했습니다.','search-failed':'예시 · 검색을 완료하지 못했습니다. 결과 없음과 다르며 성공 기록으로 저장하지 않습니다.'}[scenario];return `<div role="status" class="${['fallback','translation-failed','search-failed'].includes(scenario)?'notice':'status'}">${text}</div>`;}
function results(){const rows=samples.map((sample,id)=>({...sample,id})).filter(s=>source==='all'||source===s.source);return `<section class="results" aria-label="검색 결과"><div class="results-meta"><h2>근거 문단</h2><small>가상 ${['empty','search-failed'].includes(scenario)?0:rows.length}건</small></div>${['empty','search-failed'].includes(scenario)?'<p class="muted">표시할 결과가 없습니다.</p>':rows.map(s=>`<button class="result ${selected===s.id?'active':''}" data-result="${s.id}" aria-pressed="${selected===s.id}"><span class="number">${s.id+1}</span><span class="chip">${s.label}</span><h3>${s.title}</h3><small>${s.language} · ${s.date}</small><p>시안용 합성 발췌. 문헌의 원문과 위치를 대조하는 흐름을 보여줍니다.</p><small>${s.source==='vatican'?'의미 일치 · 확률/정답 판정 아님':'키워드 일치 예시'}</small></button>`).join('')}</section>`;}
function reader(){if(['empty','search-failed'].includes(scenario))return '<section class="reader panel"><h2>근거 대조</h2><p class="muted">결과를 선택하면 원문과 대응 번역을 여기에 표시합니다.</p></section>';const sample=samples[selected];return `<article class="reader panel" aria-label="선택한 근거 대조"><div class="reader-head"><span class="chip">${sample.label}</span><span class="chip neutral">보관 원문 버전 예시</span><h2>${sample.title}</h2><p class="muted">${sample.locator} · 원문 위치와 공식 번호를 구분합니다.</p></div><div class="parallel"><section><h3>보관 원문 <span class="chip neutral">${sample.language}</span></h3>${selected===0?'<p lang="en">This is an illustrative passage, not a quotation from any council document. A researcher can compare the original passage with a Korean draft while keeping its source and version visible.</p>':'<p>시안용으로 작성한 합성 문장입니다. 실제 나주 메시지나 가져온 문서의 인용문이 아닙니다. 원문 위치와 보관 버전을 확인하는 읽기 흐름을 보여줍니다.</p>'}</section><section><h3>${selected===0?'한국어 번역':'한국어 원문'} <span class="chip warning">${selected===0?'로컬 생성 · 미검토':selected===2?'OCR 미검토':'원문 · 번역 아님'}</span></h3>${scenario==='translation-failed'&&selected===0?'<div class="notice"><strong>번역 실패 예시</strong><p>제3언어 혼입으로 출력을 거부했습니다. 생성 실패를 빈 번역이나 검토된 번역으로 표시하지 않습니다.</p><button data-action="retry">재시도 상태 예시</button></div>':`<p>${selected===0?'이 글은 공의회 문헌의 인용이 아닌 화면 검토용 합성 문단입니다. 연구자는 출처와 버전을 확인하면서 원문과 한국어 초안을 비교할 수 있습니다.':'원문이 한국어이므로 별도 모델 번역을 만들지 않습니다. OCR 문서는 원본 페이지와 대조가 필요합니다.'}</p>${selected===0?'<small>공식 번역이 아닙니다. 용어·주어·부정·인용을 원문과 대조하세요.</small>':''}`}</section></div><div class="actions"><button disabled>공식 페이지 열기 · 시안</button><button disabled>보관 파일 열기 · 시안</button><button disabled>근거 위치 복사 · 시안</button></div><details class="evidence"><summary>근거와 생성 정보 예시</summary><p>문헌판 demo-edition · 원문 demo-version-03 · 문단 demo-passage-${selected+1}<br>번역 demo-translation · 모델/프롬프트 버전 표시 위치 · 사람 승인 없음<br>모든 ID는 가상이며 실제 URL이나 파일에 연결하지 않았습니다.</p></details></article>`;}
function historyView(){return `<div class="page-title"><h1>검색 기록</h1><p class="muted">당시 결과 열기와 현재 보관 자료로 다시 검색하기를 구분합니다.</p></div><div class="panel rows">${['성경과 성전의 관계','성체와 교회의 일치','기도와 봉헌'].map((q,i)=>`<section class="row"><div><span class="chip neutral">합성 기록 ${i+1}</span><h3>${q}</h3><small>예시 10:${10-i}0 · 전체 출처 · 자료 세대 03 · 원문 버전 보존</small></div><div class="actions"><button data-history="${i}">당시 결과 열기</button><button data-latest="${i}">현재 보관 자료로 재검색</button></div></section>`).join('')}</div><div class="notice">재검색은 웹사이트 재수집이 아닙니다. 실제 UI에서는 당시 질의·필터·모델과 검색 시각을 함께 보여줍니다.</div>`;}
function libraryView(){return `<div class="page-title"><h1>자료실</h1><p class="muted">아래는 수집/가져오기 상태를 설명하기 위한 가상 문헌 목록입니다.</p></div><button disabled>PDF·TXT·HTML·DOCX 파일 가져오기 · 시안</button><div class="panel rows" style="margin-top:18px">${samples.map((s,i)=>`<section class="row"><div><span class="chip">${s.label}</span><h3>${s.title}</h3><small>${s.language} · ${s.date}</small></div><div><span class="chip ${i===2?'warning':'neutral'}">${i===2?'부분 추출 · OCR 확인 필요':'샘플 보관 · 전체 수집 아님'}</span><button data-library="${i}">문헌 예시 열기</button></div></section>`).join('')}</div><div class="notice">교황청/나주라는 출처 분류는 동일한 권위나 교회 승인 상태를 뜻하지 않습니다. 가져온 파일은 발행 출처와 가져온 경로를 따로 보여줍니다. 공의회별 미확보·실패 자료도 전체 목록에서 구분할 예정입니다.</div>`;}
function VariantA(){return `${header(true)}<div class="shell-a"><aside>${nav()}<small>연구 순서<br>검색 → 근거 대조<br>→ 기록에서 다시 열기</small><small>전체 수집·번역 검토는<br>아직 완료되지 않았습니다.</small></aside><main id="main" class="work-a">${screen==='search'?`${searchForm()}${status()}<div class="split-a">${results()}${reader()}</div>`:screen==='history'?historyView():libraryView()}</main></div>`;}
function VariantB(){return `${header()}<main id="main" class="portal">${screen==='search'?`<div class="hero"><span class="chip">근거부터 확인하는 검색</span><h1>어떤 문헌을 찾고 계신가요?</h1><p class="muted">교황청 문헌 · 나주 사랑의 메시지 · 가져온 자료</p></div>${searchForm()}${status()}${results()}${reader()}`:screen==='history'?historyView():libraryView()}</main>`;}
function VariantC(){return `${header()}${screen==='search'?`<div class="reading-bar">${searchForm()}</div>${`<main id="main" class="reading-shell"><div>${status()}${reader()}</div>${results()}</main>`}`:`<main id="main" class="simple">${screen==='history'?historyView():libraryView()}</main>`}`;}
function render(){document.getElementById('app').innerHTML=({A:VariantA,B:VariantB,C:VariantC}[variant])()+`<footer class="state">${scenarioBar()}<p id="state-text">시안 ${variant} · 화면 ${screen} · 출처 ${source} · 방식 ${mode} · 상태 ${scenario} · 선택 문단 ${selected+1} · 모든 데이터는 합성 예시입니다.</p></footer>`;document.getElementById('variant-label').textContent=variant+' · '+variants[variant];document.body.dataset.variant=variant;}
function switchVariant(offset){variant='ABC'[('ABC'.indexOf(variant)+offset+3)%3];const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render();}
document.getElementById('previous').onclick=()=>switchVariant(-1);
document.getElementById('next').onclick=()=>switchVariant(1);
document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,button,[contenteditable]'))return;if(['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();switchVariant(event.key==='ArrowLeft'?-1:1);}});
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;let focusReader=false;if(button.dataset.screen){screen=button.dataset.screen;render();}else if(button.dataset.result!==undefined){selected=Number(button.dataset.result);focusReader=true;render();}else if(button.dataset.history!==undefined||button.dataset.latest!==undefined){const old=button.dataset.history!==undefined;query=['성경과 성전의 관계','성체와 교회의 일치','기도와 봉헌'][Number(old?button.dataset.history:button.dataset.latest)];screen='search';source='all';selected=0;scenario=old?'reused':'normal';message=old?'': '예시 · 현재 보관 자료로 새로 검색했습니다. 웹사이트를 재수집하지 않았습니다.';render();}else if(button.dataset.library!==undefined){selected=Number(button.dataset.library);source=samples[selected].source;screen='search';scenario='normal';render();focusReader=true;}else if(button.dataset.action==='retry'){scenario='normal';message='예시 · 재시도 화면으로 전환했습니다. 실제 번역 모델을 호출하지 않았습니다.';render();}if(focusReader){const reader=document.querySelector('.reader');reader.tabIndex=-1;reader.focus({preventScroll:true});}});
document.addEventListener('submit',event=>{if(event.target.id!=='search-form')return;event.preventDefault();const data=new FormData(event.target);query=String(data.get('query')).trim();source=data.get('source');mode=data.get('mode');selected=source==='all'?0:samples.findIndex(s=>s.source===source);scenario='normal';message='검색 UI 예시만 갱신했습니다. 입력 질문과 무관하게 합성 문단을 표시하며 실제 검색이 아닙니다.';render();});
document.addEventListener('change',event=>{if(event.target.id==='scenario'){scenario=event.target.value;render();}});
render();
</script>
</html>
